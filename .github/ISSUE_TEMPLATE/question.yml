name: ❓ Question
description: Ask a question about Kura
title: "(Question) "
labels: ["question"]
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What would you like to know?
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: What have you tried?
      description: Commands run, documentation pages read, results seen.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Relevant reports, snippets, or the document in question.
    validations:
      required: false
