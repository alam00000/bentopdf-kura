name: npm-publish

on:
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string
      force:
        description: publish even if the registry already has this version
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    env:
      TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
      FORCE: ${{ inputs.force }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.event.workflow_run.head_branch }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: update npm for trusted publishing
        run: npm install -g npm@latest
      - name: npm auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
            echo "auth: npm token from the NPM_TOKEN secret"
          else
            echo "auth: OIDC trusted publishing"
          fi
      - name: verify every package version matches the release tag
        run: |
          node scripts/version-check.mjs
          PKG="$(node -p "require('./packages/npm/kura-pdf/package.json').version")"
          [ "v$PKG" = "$TAG" ] || { echo "packages are at $PKG but the tag is $TAG"; exit 1; }
      - name: fetch the release archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p rel wasm
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'kura-*' --dir rel
          ls -la rel
          tar -xzf rel/kura-*-wasm.tar.gz -C wasm
      - name: fill the platform packages from the release
        run: scripts/pack-native-npm.sh "$PWD/rel"
      - name: assemble kura-pdf-wasm
        run: scripts/pack-wasm-npm.sh "$PWD/wasm"
      - name: smoke test the WebAssembly package
        run: node scripts/smoke.mjs
      - name: smoke test the native package with the released Linux binary
        run: node scripts/smoke-native.mjs
      - name: publish
        run: |
          set -e
          VERSION="${TAG#v}"
          publish() {
            local dir=$1 name
            name=$(node -p "require('./packages/npm/$dir/package.json').name")
            if [ "$FORCE" != "true" ] && [ "$(npm view "$name@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
              echo "$name $VERSION is already on the registry; skipping"
              return 0
            fi
            (cd "packages/npm/$dir" && npm publish --provenance --access public --ignore-scripts)
            for i in $(seq 1 30); do
              if [ "$(npm view "$name@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
                echo "$name $VERSION is live"
                return 0
              fi
              sleep 10
            done
            echo "$name $VERSION did not appear on the registry"
            return 1
          }
          missing=""
          for pkg in kura-pdf-linux-x64 kura-pdf-darwin-arm64 kura-pdf-win32-x64; do
            if [ -z "$(find "packages/npm/$pkg/bin" -type f \( -name kura -o -name kura.exe \) 2>/dev/null | head -1)" ]; then
              echo "skipping $pkg: no binary on this release"
              missing="$missing $pkg"
            elif ! publish "$pkg"; then
              echo "$pkg could not be published; kura-pdf ships without it and npm skips the optional dependency on that platform"
              missing="$missing $pkg"
            fi
          done
          publish kura-pdf-wasm
          publish kura-pdf
          if [ -n "$missing" ]; then
            echo "::warning::platform packages not published for $TAG:$missing"
          fi
