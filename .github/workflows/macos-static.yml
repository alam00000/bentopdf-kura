name: macos-static

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PDFIUM_BRANCH: chromium/7961

jobs:
  build:
    name: macOS arm64 self-contained binary
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Cache built PDFium
        id: pdfium-cache
        uses: actions/cache/restore@v4
        with:
          path: pdfa-engine/third_party/pdfium-build/dist
          key: pdfium-mac-arm64-${{ env.PDFIUM_BRANCH }}-${{ hashFiles('pdfa-engine/scripts/pdfium/*') }}

      - name: Build PDFium from source
        if: steps.pdfium-cache.outputs.cache-hit != 'true'
        working-directory: pdfa-engine
        run: |
          ./scripts/pdfium/sync.sh
          ./scripts/pdfium/build.sh mac-arm64
          rm -rf third_party/pdfium-build/pdfium-src third_party/pdfium-build/depot_tools

      - name: Save built PDFium
        if: steps.pdfium-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: pdfa-engine/third_party/pdfium-build/dist
          key: pdfium-mac-arm64-${{ env.PDFIUM_BRANCH }}-${{ hashFiles('pdfa-engine/scripts/pdfium/*') }}

          key: ${{ steps.pdfium-cache.outputs.cache-primary-key }}

      - name: Install engine dependencies
        run: brew install cmake ninja qpdf freetype openjpeg jpeg-turbo libpng little-cms2 openssl@3

      - name: Configure and build
        working-directory: pdfa-engine
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPDFA_STATIC_DEPS=ON \
            -DCMAKE_PREFIX_PATH="$(brew --prefix)"
          cmake --build build --target kura kura_sdk

      - name: Assert the binary is self-contained
        working-directory: pdfa-engine
        run: |
          set -e
          otool -L build/cli/kura
          leaked=$(otool -L build/cli/kura | tail -n +2 | grep -vE '/usr/lib/|/System/Library/' | wc -l | tr -d ' ')
          echo "non-OS shared libraries: $leaked"
          test "$leaked" -eq 0

      - name: Convert a document
        working-directory: pdfa-engine
        run: |
          set -e
          printf '%%PDF-1.7\n1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << >> >>\nendobj\ntrailer\n<< /Size 4 /Root 1 0 R >>\n%%%%EOF\n' > /tmp/in.pdf
          report=$(./build/cli/kura --level 2b /tmp/in.pdf /tmp/out.pdf)
          echo "$report"
          echo "$report" | grep -q '"ok":true'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kura-macos-arm64
          path: |
            pdfa-engine/build/cli/kura
            pdfa-engine/build/capi/libkura.a
            pdfa-engine/build/raster/libkura_raster.a
            pdfa-engine/third_party/pdfium-build/dist/mac-arm64/libpdfium.a
          if-no-files-found: error
