name: linux-static

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QPDF_VERSION: 12.3.2
  PDFIUM_BRANCH: chromium/7961

jobs:
  build:
    name: Linux x86-64 self-contained binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Install engine dependencies
        run: |
          scripts/linux-static.sh packages

      - name: Cache qpdf
        id: qpdf-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/qpdf-install
          key: qpdf-static-${{ env.QPDF_VERSION }}-${{ runner.os }}

      - name: Build qpdf from source (static)
        if: steps.qpdf-cache.outputs.cache-hit != 'true'
        run: |
          scripts/linux-static.sh qpdf

      - name: Save qpdf
        if: steps.qpdf-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/qpdf-install
          key: qpdf-static-${{ env.QPDF_VERSION }}-${{ runner.os }}

      - name: Cache FreeType, Little CMS and OpenJPEG
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/deps-install
          key: static-deps-lcms2-2.16-openjpeg-2.5.4-freetype-2.13.2-${{ runner.os }}

      - name: Build FreeType, Little CMS and OpenJPEG from source (static)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          scripts/linux-static.sh deps

      - name: Save FreeType, Little CMS and OpenJPEG
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/deps-install
          key: static-deps-lcms2-2.16-openjpeg-2.5.4-freetype-2.13.2-${{ runner.os }}

      - name: Cache built PDFium
        id: pdfium-cache
        uses: actions/cache/restore@v4
        with:
          path: pdfa-engine/third_party/pdfium-build/dist
          key: pdfium-linux-x64-${{ env.PDFIUM_BRANCH }}-${{ hashFiles('pdfa-engine/scripts/pdfium/*') }}-qpdf${{ env.QPDF_VERSION }}-deps-2.13.2-2.16-2.5.4

      - name: Build PDFium from source
        if: steps.pdfium-cache.outputs.cache-hit != 'true'
        run: |
          scripts/linux-static.sh pdfium

      - name: Save built PDFium
        if: steps.pdfium-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: pdfa-engine/third_party/pdfium-build/dist
          key: pdfium-linux-x64-${{ env.PDFIUM_BRANCH }}-${{ hashFiles('pdfa-engine/scripts/pdfium/*') }}-qpdf${{ env.QPDF_VERSION }}-deps-2.13.2-2.16-2.5.4

      - name: Configure and build
        run: |
          scripts/linux-static.sh engine

      - name: Assert the binary is self-contained and converts a document
        run: scripts/linux-static.sh verify

      - name: Upload the crashing binary for local debugging
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kura-linux-x64-crash
          path: |
            pdfa-engine/build/cli/kura
            pdfa-engine/third_party/pdfium-build/dist/linux-x64/libpdfium.a
            pdfa-engine/third_party/pdfium-build/dist/linux-x64/libpdfium.a.rename
          if-no-files-found: ignore

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kura-linux-x64
          path: |
            pdfa-engine/build/cli/kura
            pdfa-engine/build/capi/libkura.a
            pdfa-engine/build/raster/libkura_raster.a
            pdfa-engine/third_party/pdfium-build/dist/linux-x64/libpdfium.a
          if-no-files-found: error
