name: linux-static

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QPDF_VERSION: 12.3.2
  PDFIUM_BRANCH: chromium/7961

jobs:
  build:
    name: Linux x86-64 self-contained binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Install engine dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libglib2.0-dev clang lld gdb \
            cmake ninja-build pkg-config zlib1g-dev libjpeg-dev \
            libfreetype-dev libpng-dev libopenjp2-7-dev liblcms2-dev \
            libssl-dev libbz2-dev qpdf

      - name: Cache qpdf
        id: qpdf-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/qpdf-install
          key: qpdf-static-${{ env.QPDF_VERSION }}-${{ runner.os }}

      - name: Build qpdf from source (static)
        if: steps.qpdf-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o /tmp/qpdf.tar.gz \
            "https://github.com/qpdf/qpdf/releases/download/v${QPDF_VERSION}/qpdf-${QPDF_VERSION}.tar.gz"
          tar -xzf /tmp/qpdf.tar.gz -C /tmp
          cmake -S "/tmp/qpdf-${QPDF_VERSION}" -B /tmp/qpdf-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DREQUIRE_CRYPTO_OPENSSL=ON -DUSE_IMPLICIT_CRYPTO=OFF \
            -DBUILD_DOC=OFF -DBUILD_EXAMPLES=OFF -DQPDF_TEST_COMPARE_IMAGES=OFF \
            -DCMAKE_INSTALL_PREFIX="$HOME/qpdf-install"
          cmake --build /tmp/qpdf-build --target libqpdf
          cmake --install /tmp/qpdf-build --component dev
          cmake --install /tmp/qpdf-build --component lib

      - name: Save qpdf
        if: steps.qpdf-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/qpdf-install
          key: qpdf-static-${{ env.QPDF_VERSION }}-${{ runner.os }}

          key: ${{ steps.qpdf-cache.outputs.cache-primary-key }}

      - name: Cache FreeType, Little CMS and OpenJPEG
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/deps-install
          key: static-deps-lcms2-2.16-openjpeg-2.5.4-freetype-2.13.2-${{ runner.os }}

      - name: Build FreeType, Little CMS and OpenJPEG from source (static)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o /tmp/lcms2.tar.gz https://github.com/mm2/Little-CMS/releases/download/lcms2.16/lcms2-2.16.tar.gz
          tar -xzf /tmp/lcms2.tar.gz -C /tmp
          (cd /tmp/lcms2-2.16 && ./configure --prefix="$HOME/deps-install" --disable-shared --enable-static --without-jpeg --without-tiff && make -j"$(nproc)" && make install)
          curl -sSL -o /tmp/openjpeg.tar.gz https://github.com/uclouvain/openjpeg/archive/refs/tags/v2.5.4.tar.gz
          tar -xzf /tmp/openjpeg.tar.gz -C /tmp
          cmake -S /tmp/openjpeg-2.5.4 -B /tmp/openjpeg-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DBUILD_STATIC_LIBS=ON \
            -DBUILD_CODEC=OFF -DBUILD_TESTING=OFF -DCMAKE_INSTALL_PREFIX="$HOME/deps-install"
          cmake --build /tmp/openjpeg-build
          cmake --install /tmp/openjpeg-build
          curl -sSL -o /tmp/freetype.tar.gz https://gitlab.freedesktop.org/freetype/freetype/-/archive/VER-2-13-2/freetype-VER-2-13-2.tar.gz
          tar -xzf /tmp/freetype.tar.gz -C /tmp
          cmake -S /tmp/freetype-VER-2-13-2 -B /tmp/freetype-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DFT_DISABLE_HARFBUZZ=ON -DFT_DISABLE_BROTLI=ON -DFT_DISABLE_BZIP2=ON \
            -DFT_REQUIRE_ZLIB=ON -DFT_REQUIRE_PNG=ON -DCMAKE_INSTALL_PREFIX="$HOME/deps-install"
          cmake --build /tmp/freetype-build
          cmake --install /tmp/freetype-build

      - name: Save FreeType, Little CMS and OpenJPEG
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/deps-install
          key: static-deps-lcms2-2.16-openjpeg-2.5.4-freetype-2.13.2-${{ runner.os }}

          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

      - name: Cache built PDFium
        id: pdfium-cache
        uses: actions/cache/restore@v4
        with:
          path: pdfa-engine/third_party/pdfium-build/dist
          key: pdfium-linux-x64-${{ env.PDFIUM_BRANCH }}-${{ hashFiles('pdfa-engine/scripts/pdfium/*') }}-qpdf${{ env.QPDF_VERSION }}-deps-2.13.2-2.16-2.5.4

      - name: Build PDFium from source
        if: steps.pdfium-cache.outputs.cache-hit != 'true'
        working-directory: pdfa-engine
        run: |
          ./scripts/pdfium/sync.sh
          ./scripts/pdfium/build.sh linux-x64
          rm -rf third_party/pdfium-build/pdfium-src third_party/pdfium-build/depot_tools

      - name: Save built PDFium
        if: steps.pdfium-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: pdfa-engine/third_party/pdfium-build/dist
          key: pdfium-linux-x64-${{ env.PDFIUM_BRANCH }}-${{ hashFiles('pdfa-engine/scripts/pdfium/*') }}-qpdf${{ env.QPDF_VERSION }}-deps-2.13.2-2.16-2.5.4

          key: ${{ steps.pdfium-cache.outputs.cache-primary-key }}

      - name: Configure and build
        working-directory: pdfa-engine
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld \
            -DPDFA_STATIC_DEPS=ON \
            -DCMAKE_PREFIX_PATH="$HOME/deps-install;$HOME/qpdf-install"
          cmake --build build --target kura kura_sdk

      - name: Assert the binary is self-contained
        working-directory: pdfa-engine
        run: |
          set -e
          ldd build/cli/kura || true
          leaked=$(ldd build/cli/kura \
            | grep '=>' \
            | grep -viE 'libc\.so|libm\.so|libdl\.so|libpthread\.so|librt\.so|libgcc_s\.so|libstdc\+\+\.so|ld-linux|linux-vdso' \
            | wc -l)
          echo "non-OS shared libraries: $leaked"
          test "$leaked" -eq 0
          test -z "$(ldd build/cli/kura | grep -i pdfium || true)"

      - name: Convert with no PDFium sidecar present
        working-directory: pdfa-engine
        run: |
          set -e
          test -z "$(find build third_party -name 'libpdfium.so*' 2>/dev/null)"
          printf '%%PDF-1.7\n1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << >> >>\nendobj\ntrailer\n<< /Size 4 /Root 1 0 R >>\n%%%%EOF\n' > /tmp/in.pdf
          if ! report=$(./build/cli/kura --level 2b /tmp/in.pdf /tmp/out.pdf); then
            echo "conversion failed with status $?; backtrace:"
            gdb -batch -ex run -ex bt -ex 'info symbol $pc' -ex 'x/6i $pc' -ex 'frame 3' -ex 'x/24i $pc-72' --args ./build/cli/kura --level 2b /tmp/in.pdf /tmp/out.pdf 2>&1 | tail -90
            exit 1
          fi
          echo "$report"
          echo "$report" | grep -q '"ok":true'

      - name: Upload the crashing binary for local debugging
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kura-linux-x64-crash
          path: |
            pdfa-engine/build/cli/kura
            pdfa-engine/third_party/pdfium-build/dist/linux-x64/libpdfium.a
            pdfa-engine/third_party/pdfium-build/dist/linux-x64/libpdfium.a.rename
          if-no-files-found: ignore

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kura-linux-x64
          path: |
            pdfa-engine/build/cli/kura
            pdfa-engine/build/capi/libkura.a
            pdfa-engine/build/raster/libkura_raster.a
            pdfa-engine/third_party/pdfium-build/dist/linux-x64/libpdfium.a
          if-no-files-found: error
